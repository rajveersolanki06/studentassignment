<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="formTitle">
        Add Assignment - Assignment Management
    </title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            Assignment Management System
        </div>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="assignments.html">
                Assignments
            </a>

            <button id="logoutBtn" class="logout-btn">
                Logout
            </button>

        </div>

    </nav>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h3>Menu</h3>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="assignments.html">
                Assignments
            </a>

            <a href="add-assignment.html">
                Add Assignment
            </a>

            <a href="students.html">
                Students
            </a>

            <a href="submissions.html">
                Submissions
            </a>

            <a href="about.html">
                About
            </a>

        </aside>

        <!-- Form -->
        <main class="content">

            <div class="form-box wide-form">

                <h1 id="formHeading">
                    Add Assignment
                </h1>

                <form id="assignmentForm">

                    <label for="title">
                        Assignment Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        required
                    >

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subject"
                        required
                    >

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="5"
                        required
                    ></textarea>

                    <label for="deadline">
                        Deadline
                    </label>

                    <input
                        type="date"
                        id="deadline"
                        required
                    >

                    <label for="teacher">
                        Teacher Name
                    </label>

                    <input
                        type="text"
                        id="teacher"
                        required
                    >

                    <button
                        type="submit"
                        class="btn"
                        id="saveButton"
                    >
                        Add Assignment
                    </button>

                    <a
                        href="assignments.html"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </main>

    </div>

    <script src="js/auth.js"></script>
    <script src="js/assignments.js"></script>

</body>
</html>
